<!DOCTYPE html>
<html>
<head>
  <title>Product Cards</title>

  <style>
    .container{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
    }

    .card{
      width:250px;
      border:1px solid gray;
      padding:15px;
      text-align:center;
      border-radius:10px;
    }

    .card img{
      width:150px;
      height:150px;
      object-fit:contain;
    }
  </style>
</head>

<body>

  <div class="container" id="products"></div>

  <script>

    fetch("https://fakestoreapi.com/products/")
      .then((response) => response.json())
      .then((data) => {

        let cards = data.map((product) => {

          return `
            <div class="card">
              <img src="${product.image}">
              <h3>${product.title}</h3>
              <p>₹ ${product.price}</p>
            </div>
          `;

        });

        document.getElementById("products").innerHTML = cards.join("");

      });

  </script>
  <script src="task7.js"></script>

</body>
</html>
